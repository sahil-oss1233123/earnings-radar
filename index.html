<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d18">
<meta name="description" content="Upcoming and reported earnings for AI stocks: expected EPS and revenue, results, beats and misses.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Earnings">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<title>Earnings Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one thumb-width column. Next report as a live countdown "lamp", then a day-by-day list; tap any card for a bottom sheet. */
:root{
  --ink:#0a0d18;          /* night-session background */
  --panel:#141a2b;        /* cards */
  --line:#232b42;         /* hairlines */
  --text:#eef1fa;
  --muted:#8c96b3;
  --amber:#ffb547;        /* accent: what's next */
  --beat:#43e0a3;         /* semantic: beat */
  --miss:#ff6f6f;         /* semantic: miss */
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Figtree",-apple-system,system-ui,sans-serif;
  --r:22px;
  --spring:cubic-bezier(.22,1.2,.36,1);
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased}
body{min-height:100%;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:12px}
.num{font-variant-numeric:tabular-nums}

/* ambient glow behind the header */
.aura{position:fixed;inset:0 0 auto 0;height:420px;pointer-events:none;z-index:0;
  background:
   radial-gradient(60% 70% at 85% -10%, rgba(255,181,71,.20), transparent 70%),
   radial-gradient(50% 60% at 0% 0%, rgba(67,224,163,.10), transparent 70%);
  filter:saturate(1.1)}

.app{position:relative;z-index:1;max-width:520px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 18px) max(16px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 40px) max(16px,env(safe-area-inset-left))}

/* header */
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 2px 14px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;margin:6px 0 0;letter-spacing:-.02em;text-wrap:balance}
h1 span{color:var(--amber)}
.mineBtn{display:flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);
  background:rgba(20,26,43,.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-weight:600;font-size:14px;color:var(--muted);
  transition:all .35s var(--ease)}
.mineBtn svg{width:16px;height:16px}
.mineBtn[aria-pressed="true"]{color:var(--ink);background:var(--amber);border-color:var(--amber)}

/* summary strip */
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:rgba(20,26,43,.6);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:22px;font-weight:700}
.stat small{color:var(--muted);font-size:12px}

/* hero: next report */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:20px 20px 18px;margin-bottom:18px;
  background:linear-gradient(160deg,#1b2338 0%,#121828 60%);border:1px solid #2c3554;cursor:pointer;
  transition:transform .4s var(--spring)}
.hero:active{transform:scale(.985)}
.hero::after{content:"";position:absolute;width:260px;height:260px;right:-80px;top:-110px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,181,71,.35),transparent 65%);pointer-events:none;animation:breathe 5s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.15);opacity:.7}}
.heroTop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 0 rgba(255,181,71,.6);animation:ping 1.8s infinite}
@keyframes ping{70%{box-shadow:0 0 0 9px rgba(255,181,71,0)}100%{box-shadow:0 0 0 0 rgba(255,181,71,0)}}
.heroName{display:flex;align-items:center;gap:12px;margin:14px 0 4px}
.heroName .tk{font-family:var(--display);font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1}
.heroName .co{color:var(--muted);font-size:14px;margin-top:3px}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
.count div{background:rgba(10,13,24,.55);border:1px solid #2a3350;border-radius:16px;padding:10px 0 8px;text-align:center}
.count b{display:block;font-family:var(--display);font-size:28px;font-weight:700;line-height:1.05}
.count small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.count b.tick{animation:tick .45s var(--spring)}
@keyframes tick{from{transform:translateY(-6px);opacity:.3}}
.heroGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.kv small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.kv b{font-family:var(--display);font-size:20px;font-weight:700}
.local{margin-top:14px;padding-top:12px;border-top:1px solid #2a3350;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.local strong{color:var(--text);font-weight:600}

/* segmented control */
.seg{position:relative;display:grid;grid-template-columns:repeat(2,1fr);padding:4px;border-radius:14px;background:#11172a;border:1px solid var(--line);margin-bottom:12px}
.seg button{position:relative;z-index:1;height:36px;border-radius:10px;font-weight:600;font-size:15px;color:var(--muted);transition:color .3s}
.seg button[aria-selected="true"]{color:var(--text)}
.seg .pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:10px;background:#252e49;
  box-shadow:0 2px 10px rgba(0,0,0,.35);transition:transform .45s var(--spring)}
.seg[data-tab="reported"] .pill{transform:translateX(100%)}

/* day strip */
.strip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 12px;margin:0 -2px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;scroll-snap-align:start;min-width:58px;padding:8px 6px;border-radius:16px;background:#11172a;border:1px solid var(--line);text-align:center;transition:transform .3s var(--spring),background .3s}
.day:active{transform:scale(.94)}
.day small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.day b{display:block;font-family:var(--display);font-size:22px;font-weight:700;margin:2px 0}
.dots{display:flex;gap:3px;justify-content:center;height:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--amber)}
.dots i.b{background:var(--beat)}.dots i.m{background:var(--miss)}
.day.today{border-color:var(--amber)}

/* list */
.group{margin:14px 0 6px}
.gh{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 8px}
.gh h2{font-family:var(--display);font-size:19px;font-weight:700;margin:0}
.gh span{color:var(--muted);font-size:13px}
.cards{display:grid;gap:10px}
.card{position:relative;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:14px 14px 14px 12px;border-radius:var(--r);
  background:var(--panel);border:1px solid var(--line);cursor:pointer;transition:transform .35s var(--spring),border-color .3s;
  animation:rise .6s var(--spring) both;animation-delay:calc(var(--i,0) * 45ms)}
.card:active{transform:scale(.975)}
@keyframes rise{from{transform:translateY(14px);opacity:.35}}
.mono{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:-.01em;
  color:hsl(var(--h) 90% 82%);background:linear-gradient(145deg,hsl(var(--h) 55% 30%),hsl(var(--h) 60% 18%));border:1px solid hsl(var(--h) 50% 36%)}
.main{min-width:0}
.r1{display:flex;align-items:center;gap:8px}
.r1 .tk{font-family:var(--display);font-weight:700;font-size:18px}
.q{font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.co{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:#c3cae0;background:#1c2338;border-radius:8px;padding:3px 8px}
.chip svg{width:13px;height:13px}
.chip.est{color:var(--amber);background:rgba(255,181,71,.1)}
.side{text-align:right}
.side small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.side b{font-family:var(--display);font-size:20px;font-weight:700}
.side .sub{font-size:12px;color:var(--muted);margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;letter-spacing:.06em;border-radius:999px;padding:4px 10px}
.badge.b{color:#062b1d;background:var(--beat);box-shadow:0 0 18px rgba(67,224,163,.35)}
.badge.m{color:#330b0b;background:var(--miss);box-shadow:0 0 18px rgba(255,111,111,.3)}
.badge.due{color:var(--amber);background:rgba(255,181,71,.12)}
.up{color:var(--beat)}.down{color:var(--miss)}
.star{position:absolute;top:8px;right:8px;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;color:#4a5373;transition:transform .4s var(--spring),color .2s}
.star svg{width:15px;height:15px}
.star[aria-pressed="true"]{color:var(--amber)}
.star:active{transform:scale(1.35)}
.card .side{padding-right:22px}
.track{display:flex;gap:4px;align-items:center}
.track i{width:9px;height:9px;border-radius:50%;border:1.5px solid #3a4466}
.track i.b{background:var(--beat);border-color:var(--beat)}
.track i.m{background:var(--miss);border-color:var(--miss)}
.empty{color:var(--muted);text-align:center;padding:40px 10px;border:1px dashed var(--line);border-radius:var(--r)}
footer{color:var(--muted);font-size:12px;line-height:1.5;margin:28px 6px 0}

/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(4,6,12,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .35s var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;max-height:88%;overflow-y:auto;overscroll-behavior:contain;
  background:#121829;border:1px solid #2a3350;border-bottom:0;border-radius:28px 28px 0 0;
  padding:8px 20px calc(env(safe-area-inset-bottom) + 26px);transform:translateY(105%);transition:transform .5s var(--spring);box-shadow:0 -20px 60px rgba(0,0,0,.5)}
.sheet:not(.on){visibility:hidden;transition:transform .5s var(--spring),visibility 0s .5s}
.sheet.on{transform:translateY(0)}
.sheet.drag{transition:none}
.grab{width:42px;height:5px;border-radius:3px;background:#3a4466;margin:6px auto 14px}
.sh{display:flex;align-items:center;gap:12px}
.sh .tk{font-family:var(--display);font-size:28px;font-weight:800;line-height:1}
.sh .co{font-size:14px}
.closeBtn{margin-left:auto;width:34px;height:34px;border-radius:50%;background:#1f273f;display:grid;place-items:center;color:var(--muted)}
.closeBtn svg{width:14px;height:14px}
.sec{margin-top:18px}
.sec h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:700}
.box{background:#171e33;border:1px solid var(--line);border-radius:18px;padding:14px}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:72px 1fr 78px;align-items:center;gap:10px;font-size:13px}
.bar span{color:var(--muted)}
.bar .track2{height:12px;border-radius:6px;background:#0e1322;overflow:hidden}
.bar .fill{height:100%;border-radius:6px;background:#56607f;transform-origin:left;animation:grow .9s var(--spring) both}
.bar .fill.act{background:var(--beat)}.bar .fill.act.m{background:var(--miss)}
.bar .fill.exp{background:repeating-linear-gradient(-45deg,#ffb547 0 6px,#e0992e 6px 12px)}
@keyframes grow{from{transform:scaleX(0)}}
.bar b{text-align:right;font-family:var(--display);font-size:16px}
.surp{margin-top:10px;font-size:13px;color:var(--muted)}
.rows{display:grid;gap:8px;font-size:14px}
.rows div{display:flex;justify-content:space-between;gap:12px}
.rows span{color:var(--muted)}
.rows b{font-weight:600;text-align:right}
.note{font-size:15px;line-height:1.5;margin:0}
.src{display:grid;gap:6px}
.src a{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:12px;background:#171e33;border:1px solid var(--line);text-decoration:none;font-size:14px}
.src a svg{width:14px;height:14px;color:var(--muted)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="aura" aria-hidden="true"></div>
<main class="app">
  <header>
    <div>
      <div class="eyebrow" id="updated">Loading…</div>
      <h1>Earnings<span>.</span></h1>
    </div>
    <button class="mineBtn" id="mineBtn" aria-pressed="false" title="Show only starred stocks">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.5 1.2 6.4L12 17.3l-5.7 3.1 1.2-6.4L2.8 9.5l6.4-.8z"/></svg>
      My list
    </button>
  </header>

  <section class="summary" id="summary" aria-label="Season summary"></section>
  <section id="hero"></section>

  <div class="seg" id="seg" role="tablist" data-tab="upcoming">
    <span class="pill" aria-hidden="true"></span>
    <button role="tab" id="tab-upcoming" aria-selected="true" data-tab="upcoming">Upcoming</button>
    <button role="tab" id="tab-reported" aria-selected="false" data-tab="reported">Reported</button>
  </div>
  <nav class="strip" id="strip" aria-label="Jump to day"></nav>
  <section id="list"></section>

  <footer id="foot">
    Expected figures are analyst consensus (adjusted EPS) from public sources, or the company's own guidance where noted. Results fill in after each company reports. Not investment advice.
  </footer>
</main>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></aside>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const TZ=Intl.DateTimeFormat().resolvedOptions().timeZone||"UTC";
const CITY=(TZ.split("/").pop()||"").replace(/_/g," ");
const STAR_KEY="earnings-radar-stars-v2";
const ICON={
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1z"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.5 1.2 6.4L12 17.3l-5.7 3.1 1.2-6.4L2.8 9.5l6.4-.8z"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  out:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'
};
const S={tab:"upcoming",mine:false,events:[],stars:null,updated:null,openT:null};

/* ---------- helpers ---------- */
function hue(t){let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))%360;return h}
function money(v){if(v==null)return"—";const a=Math.abs(v);
  if(a>=1e9)return"$"+(v/1e9).toFixed(a>=1e11?1:2).replace(/\.?0+$/,"")+"B";
  if(a>=1e6)return"$"+(v/1e6).toFixed(1).replace(/\.0$/,"")+"M";return"$"+v.toFixed(0)}
function eps(v){if(v==null)return"—";return(v<0?"−$":"$")+Math.abs(v).toFixed(2)}
function pct(v,d=1){return(v>0?"+":v<0?"−":"")+Math.abs(v).toFixed(d)+"%"}
function surprise(a,e){if(a==null||e==null||e===0)return null;return(a-e)/Math.abs(e)*100}
function etToday(){return new Intl.DateTimeFormat("en-CA",{timeZone:"America/New_York"}).format(new Date())}
function dayParts(iso){const d=new Date(iso+"T12:00:00Z");return{
  dow:d.toLocaleDateString("en-GB",{weekday:"short",timeZone:"UTC"}),
  dd:d.getUTCDate(),mon:d.toLocaleDateString("en-GB",{month:"short",timeZone:"UTC"}),
  long:d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",timeZone:"UTC"})}}
function rel(iso){const t=etToday();if(iso===t)return"Today";
  const a=new Date(iso+"T00:00:00Z"),b=new Date(t+"T00:00:00Z");const n=Math.round((a-b)/864e5);
  if(n===1)return"Tomorrow";if(n===-1)return"Yesterday";if(n>1&&n<7)return"In "+n+" days";if(n<-1&&n>-7)return(-n)+" days ago";return""}
function localTime(at){const d=new Date(at);return d.toLocaleString("en-GB",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",timeZone:TZ})}
function etTime(at){return new Date(at).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",timeZone:"America/New_York"})+" ET"}
function status(e){if(e.act)return"reported";return Date.now()>=new Date(e.at).getTime()?"due":"upcoming"}
function sessionChip(e){return e.time==="BMO"
  ?'<span class="chip">'+ICON.sun+'Before open</span>'
  :'<span class="chip">'+ICON.moon+'After close</span>'}
function track(h){const n=4;let s='<span class="track" aria-label="'+trackText(h)+'">';
  for(let i=n-1;i>=0;i--){const v=h[i];s+='<i class="'+(v==="B"?"b":v==="M"?"m":"")+'"></i>'}return s+"</span>"}
function trackText(h){if(!h.length)return"No history on file";const b=h.filter(x=>x==="B").length;return"Beat "+b+" of last "+h.length}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

/* ---------- stars (per viewer, best effort) ---------- */
function loadStars(){let saved=null;try{saved=JSON.parse(localStorage.getItem(STAR_KEY)||"null")}catch(e){}
  S.stars=new Set(Array.isArray(saved)?saved:S.events.filter(e=>e.watch).map(e=>e.t))}
function saveStars(){try{localStorage.setItem(STAR_KEY,JSON.stringify([...S.stars]))}catch(e){}}
function toggleStar(t){S.stars.has(t)?S.stars.delete(t):S.stars.add(t);saveStars();render();if(S.openT===t)openSheet(t,true)}

function visible(){return S.events.filter(e=>!S.mine||S.stars.has(e.t))}

/* ---------- render ---------- */
function render(){
  const ev=visible();
  const rep=ev.filter(e=>status(e)==="reported");
  const upc=ev.filter(e=>status(e)!=="reported");
  const beats=rep.filter(e=>surprise(e.act.eps,e.est.eps)>=0).length;
  $("#summary").innerHTML=
    '<div class="stat"><b class="num">'+upc.length+'</b><small>Upcoming</small></div>'+
    '<div class="stat"><b class="num">'+rep.length+'</b><small>Reported</small></div>'+
    '<div class="stat"><b class="num">'+(rep.length?Math.round(beats/rep.length*100)+"%":"—")+'</b><small>EPS beat rate</small></div>';
  renderHero(upc);
  const list=S.tab==="upcoming"?upc.sort((a,b)=>new Date(a.at)-new Date(b.at)):rep.sort((a,b)=>new Date(b.at)-new Date(a.at));
  const groups=[];for(const e of list){let g=groups[groups.length-1];if(!g||g.date!==e.date){g={date:e.date,items:[]};groups.push(g)}g.items.push(e)}
  const today=etToday();
  $("#strip").innerHTML=groups.map(g=>{const p=dayParts(g.date);
    return'<button class="day'+(g.date===today?" today":"")+'" data-jump="'+g.date+'" aria-label="'+p.long+', '+g.items.length+' reports"><small>'+p.dow+'</small><b class="num">'+p.dd+'</b><span class="dots">'+
      g.items.slice(0,4).map(e=>{if(!e.act)return"<i></i>";return'<i class="'+(surprise(e.act.eps,e.est.eps)>=0?"b":"m")+'"></i>'}).join("")+"</span></button>"}).join("");
  let i=0;
  $("#list").innerHTML=groups.length?groups.map(g=>{const p=dayParts(g.date),r=rel(g.date);
    return'<div class="group" id="d-'+g.date+'"><div class="gh"><h2>'+(r?r+" · ":"")+p.dow+" "+p.dd+" "+p.mon+'</h2><span>'+g.items.length+(g.items.length>1?" reports":" report")+'</span></div><div class="cards">'+
      g.items.map(e=>card(e,i++)).join("")+"</div></div>"}).join("")
    :'<div class="empty">'+(S.mine?"No starred stocks here yet. Tap the star on any card to add it to My list.":"Nothing here right now.")+"</div>";
}
function card(e,i){
  const st=status(e),starred=S.stars.has(e.t);
  let side;
  if(st==="reported"){const s=surprise(e.act.eps,e.est.eps),beat=s>=0;
    side='<span class="badge '+(beat?"b":"m")+'">'+(beat?"BEAT":"MISS")+'</span><div class="sub num">EPS '+pct(s)+'</div>'+
      (e.act.move!=null?'<div class="sub num">Stock <span class="'+(e.act.move>=0?"up":"down")+'">'+pct(e.act.move)+"</span></div>":"");
  }else if(st==="due"){side='<span class="badge due">RESULTS OUT</span><div class="sub">Updating soon</div>';
  }else{side='<small>Exp. EPS</small><b class="num">'+eps(e.est.eps)+'</b><div class="sub num">Rev '+money(e.est.rev)+"</div>"}
  return'<div class="card" role="button" tabindex="0" data-open="'+e.t+'" style="--i:'+i+';--h:'+hue(e.t)+'">'+
    '<span class="mono" aria-hidden="true">'+esc(e.t)+'</span>'+
    '<span class="main"><span class="r1"><span class="tk">'+esc(e.t)+'</span><span class="q">'+esc(e.q)+'</span></span>'+
    '<span class="co" style="display:block">'+esc(e.name)+'</span>'+
    '<span class="meta">'+sessionChip(e)+(e.confirmed?"":'<span class="chip est">Est. date</span>')+(st!=="reported"?track(e.hist):"")+'</span></span>'+
    '<span class="side">'+side+'</span>'+
    '<button class="star" data-star="'+e.t+'" aria-pressed="'+starred+'" aria-label="'+(starred?"Remove "+e.t+" from":"Add "+e.t+" to")+' My list">'+ICON.star+'</button></div>';
}

/* ---------- hero countdown ---------- */
let heroEv=null,lastDigits=[];
function renderHero(upc){
  const next=upc.filter(e=>status(e)==="upcoming").sort((a,b)=>new Date(a.at)-new Date(b.at))[0];
  heroEv=next||null;lastDigits=[];
  if(!next){$("#hero").innerHTML="";return}
  const r=rel(next.date),p=dayParts(next.date);
  $("#hero").innerHTML='<div class="hero" role="button" tabindex="0" data-open="'+next.t+'" style="--h:'+hue(next.t)+'">'+
    '<div class="heroTop"><span class="live"><i></i>Next up</span><span class="chip">'+(next.time==="BMO"?ICON.sun+"Before open":ICON.moon+"After close")+'</span></div>'+
    '<div class="heroName"><span class="mono" aria-hidden="true">'+next.t+'</span><div><div class="tk">'+next.t+'</div><div class="co">'+esc(next.name)+" · "+esc(next.q)+'</div></div></div>'+
    '<div class="count num" id="count" aria-live="off"><div><b>0</b><small>days</small></div><div><b>0</b><small>hrs</small></div><div><b>0</b><small>min</small></div><div><b>0</b><small>sec</small></div></div>'+
    '<div class="heroGrid"><div class="kv"><small>Expected EPS</small><b class="num">'+eps(next.est.eps)+'</b></div><div class="kv"><small>Expected revenue</small><b class="num">'+money(next.est.rev)+'</b></div>'+
    '<div class="kv"><small>Track record</small>'+track(next.hist)+'</div><div class="kv"><small>'+(next.guide?"Company guide":"Report")+'</small><span style="font-size:13px">'+esc(next.guide||((r?r+", ":"")+p.dow+" "+p.dd+" "+p.mon))+'</span></div></div>'+
    '<div class="local"><span>'+(r?r+" · ":"")+p.dow+" "+p.dd+" "+p.mon+", "+etTime(next.at)+'</span><span><strong>'+localTime(next.at)+'</strong> '+esc(CITY)+'</span></div></div>';
  tick();
}
function tick(){
  if(!heroEv)return;const el=$("#count");if(!el)return;
  let ms=new Date(heroEv.at)-Date.now();if(ms<=0){render();return}
  const d=Math.floor(ms/864e5),h=Math.floor(ms/36e5)%24,m=Math.floor(ms/6e4)%60,s=Math.floor(ms/1e3)%60;
  const vals=[d,h,m,s].map((v,i)=>i?String(v).padStart(2,"0"):String(v));
  el.querySelectorAll("b").forEach((b,i)=>{if(lastDigits[i]!==vals[i]){b.textContent=vals[i];if(lastDigits[i]!==undefined){b.classList.remove("tick");void b.offsetWidth;b.classList.add("tick")}}});
  lastDigits=vals;
}
setInterval(tick,1000);

/* ---------- sheet ---------- */
function bar(label,v,max,cls){const w=max?Math.max(4,Math.abs(v)/max*100):0;
  return'<div class="bar"><span>'+label+'</span><div class="track2"><div class="fill '+cls+'" style="width:'+w+'%"></div></div><b class="num">'+(cls.indexOf("rev")>-1?money(v):eps(v))+"</b></div>"}
function compare(title,est,act,isRev){
  if(est==null&&act==null)return"";
  const max=Math.max(Math.abs(est||0),Math.abs(act||0));
  const s=surprise(act,est);
  let h='<div class="sec"><h3>'+title+'</h3><div class="box"><div class="bars">';
  if(est!=null)h+=bar("Expected",est,max,"exp"+(isRev?" rev":""));
  if(act!=null)h+=bar("Actual",act,max,"act"+(s!=null&&s<0?" m":"")+(isRev?" rev":""));
  h+="</div>";
  if(s!=null)h+='<div class="surp">'+(s>=0?"Beat":"Missed")+" expectations by <strong class=\""+(s>=0?"up":"down")+"\">"+pct(Math.abs(s))+"</strong></div>";
  else if(act==null)h+='<div class="surp">Actual fills in once '+(isRev?"revenue is":"results are")+" released.</div>";
  return h+"</div></div>";
}
function openSheet(t,keep){
  const e=S.events.find(x=>x.t===t);if(!e)return;S.openT=t;
  const st=status(e),p=dayParts(e.date),starred=S.stars.has(t);
  const pill=st==="reported"?(surprise(e.act.eps,e.est.eps)>=0?'<span class="badge b">BEAT</span>':'<span class="badge m">MISS</span>')
    :st==="due"?'<span class="badge due">RESULTS OUT · UPDATING</span>':'<span class="badge due">'+ICON.clock.replace('aria-hidden="true"','aria-hidden="true" width="12" height="12"')+" UPCOMING</span>";
  $("#sheet").innerHTML='<div class="grab" aria-hidden="true"></div>'+
    '<div class="sh" style="--h:'+hue(t)+'"><span class="mono" aria-hidden="true">'+t+'</span><div><div class="tk" id="sheetTitle">'+t+'</div><div class="co">'+esc(e.name)+" · "+esc(e.sector)+'</div></div>'+
    '<button class="closeBtn" id="closeSheet" aria-label="Close">'+ICON.x+'</button></div>'+
    '<div style="display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap">'+pill+'<span class="chip">'+esc(e.q)+"</span>"+sessionChip(e)+
      '<button class="chip" data-star="'+t+'" aria-pressed="'+starred+'" style="color:'+(starred?"var(--amber)":"#c3cae0")+'">'+ICON.star+(starred?"On my list":"Add to my list")+"</button></div>"+
    '<div class="sec"><h3>When</h3><div class="box rows">'+
      '<div><span>Market date</span><b>'+p.long+'</b></div>'+
      '<div><span>New York</span><b>'+etTime(e.at)+(e.time==="BMO"?" · before open":" · after close")+'</b></div>'+
      '<div><span>Your time ('+esc(CITY)+')</span><b>'+localTime(e.at)+'</b></div>'+
      '<div><span>Date status</span><b>'+(e.confirmed?"Confirmed":"Estimated")+"</b></div></div></div>"+
    compare("Earnings per share",e.est.eps,e.act?e.act.eps:null,false)+
    compare("Revenue",e.est.rev,e.act?e.act.rev:null,true)+
    (e.estNote?'<div class="surp" style="margin:6px 4px 0">Expected figures: '+esc(e.estNote)+".</div>":"")+
    ((e.guide||(e.act&&e.act.move!=null))?'<div class="sec"><h3>Context</h3><div class="box rows">'+
      (e.guide?'<div><span>Company guide</span><b>'+esc(e.guide)+"</b></div>":"")+
      (e.act&&e.act.move!=null?'<div><span>Stock reaction</span><b class="'+(e.act.move>=0?"up":"down")+'">'+pct(e.act.move)+' <span style="color:var(--muted);font-weight:400">'+esc(e.act.moveNote||"")+"</span></b></div>":"")+
      "</div></div>":"")+
    '<div class="sec"><h3>Track record</h3><div class="box" style="display:flex;align-items:center;gap:12px">'+track(e.hist)+'<span style="font-size:14px">'+trackText(e.hist)+(e.hist.length?" quarters on file":"")+"</span></div></div>"+
    (e.note?'<div class="sec"><h3>What to know</h3><p class="note">'+esc(e.note)+"</p></div>":"")+
    '<div class="sec"><h3>Sources</h3><div class="src">'+e.src.map(s=>'<a href="'+esc(s[1])+'" target="_blank" rel="noopener">'+esc(s[0])+ICON.out+"</a>").join("")+"</div></div>";
  if(!keep){$("#sheet").scrollTop=0;$("#scrim").classList.add("on");$("#sheet").classList.add("on");document.body.style.overflow="hidden";setTimeout(()=>{const c=$("#closeSheet");c&&c.focus({preventScroll:true})},60)}
}
function closeSheet(){S.openT=null;$("#scrim").classList.remove("on");const sh=$("#sheet");sh.classList.remove("on");sh.style.transform="";document.body.style.overflow=""}

/* drag the sheet down to dismiss */
(function(){const sh=$("#sheet");let y0=null,dy=0;
  sh.addEventListener("touchstart",e=>{if(sh.scrollTop>0)return;y0=e.touches[0].clientY;dy=0},{passive:true});
  sh.addEventListener("touchmove",e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;if(dy>0){sh.classList.add("drag");sh.style.transform="translateY("+dy+"px)"}},{passive:true});
  sh.addEventListener("touchend",()=>{if(y0==null)return;sh.classList.remove("drag");if(dy>110)closeSheet();else sh.style.transform="";y0=null})})();

/* ---------- events ---------- */
document.addEventListener("click",ev=>{
  const star=ev.target.closest("[data-star]");if(star){ev.stopPropagation();toggleStar(star.dataset.star);return}
  if(ev.target.closest("#closeSheet")||ev.target.id==="scrim"){closeSheet();return}
  const jump=ev.target.closest("[data-jump]");if(jump){const g=document.getElementById("d-"+jump.dataset.jump);g&&g.scrollIntoView({behavior:"smooth",block:"start"});return}
  const tab=ev.target.closest("[data-tab]");if(tab&&tab.tagName==="BUTTON"){setTab(tab.dataset.tab);return}
  const open=ev.target.closest("[data-open]");if(open){openSheet(open.dataset.open)}
});
document.addEventListener("keydown",ev=>{
  if(ev.key==="Escape"&&S.openT){closeSheet();return}
  if((ev.key==="Enter"||ev.key===" ")&&ev.target.matches("[data-open]")){ev.preventDefault();openSheet(ev.target.dataset.open)}
});
$("#mineBtn").addEventListener("click",()=>{S.mine=!S.mine;$("#mineBtn").setAttribute("aria-pressed",S.mine);render()});
function setTab(t){S.tab=t;$("#seg").dataset.tab=t;document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));render();
  $("#strip").scrollTo({left:0,behavior:"smooth"})}

/* ---------- load ---------- */
fetch("data/earnings.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(d=>{
  S.events=d.events||[];S.updated=d.updated;loadStars();
  const u=new Date(d.updated);
  $("#updated").textContent="Updated "+u.toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",timeZone:TZ});
  if(!S.events.some(e=>status(e)!=="reported"))setTab("reported");else render();
}).catch(()=>{$("#updated").textContent="Offline";$("#list").innerHTML='<div class="empty">The earnings data could not load. Reopen the page to try again.</div>'});
})();
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
</body>
</html>
